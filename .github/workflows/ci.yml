name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  self-test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Toolchain self-test (21 checks)
        run: node scripts/__fixtures__/self-test.mjs

      - name: Demo freeze verification
        run: node scripts/verify-freeze.mjs examples/demo-notes-app/design/frozen/freeze-manifest.json --base examples/demo-notes-app/design/frozen

      - name: Demo drift (expect 0)
        run: node scripts/detect-drift.mjs examples/demo-notes-app --tokens examples/demo-notes-app/design/tokens/tokens.json --json -

      - name: Demo copy check (expect 0)
        run: node scripts/check-copy.mjs examples/demo-notes-app/design/frozen/index.html --json -

      - name: Systems snapshot sanity (manifest + hashes + tokens)
        shell: bash
        run: |
          node -e "
          const fs=require('fs'),crypto=require('crypto');
          const m=JSON.parse(fs.readFileSync('systems/astryx/manifest.json','utf8'));
          if(m.schema!=='design-pipeline/system/v1'){console.error('schema');process.exit(1)}
          if(m.license!=='MIT'){console.error('license');process.exit(1)}
          for(const [f,v] of Object.entries(m.files||{})){
            const h=crypto.createHash('sha256').update(fs.readFileSync('systems/astryx/'+f)).digest('hex');
            if(h!==v.sha256){console.error('hash mismatch',f);process.exit(1)}
          }
          const j=JSON.parse(fs.readFileSync('systems/astryx/tokens/astryx-tokens.json','utf8'));
          if(!j.color||Object.keys(j.color).length<100){console.error('tokens:color');process.exit(1)}
          if(!j.spacing||Object.keys(j.spacing).length<10){console.error('tokens:spacing');process.exit(1)}
          const c=JSON.parse(fs.readFileSync('systems/astryx/components/astryx-components.json','utf8'));
          if(c.meta.count<150){console.error('components');process.exit(1)}
          console.log('systems ok', m.version, m.capabilities.components);
          "

      - name: Acceptance matrix dry-run (deterministic, no browser)
        run: node scripts/capture-acceptance.mjs --config examples/demo-notes-app/acceptance/accept.config.json --dry-run

      - name: Token extraction is non-degenerate
        run: node scripts/extract-tokens.mjs examples/demo-notes-app/design/frozen/index.html --out out-tokens

      - name: Assert extracted tokens cover spacing/font/radius
        shell: bash
        run: |
          node -e "
          const j=require('./out-tokens/tokens.json');
          const c=j.meta.counts;
          if(c.degenerate) { console.error('degenerate extraction'); process.exit(1); }
          if(Object.keys(j.spacing||{}).length<6) { console.error('spacing too few'); process.exit(1); }
          if(Object.keys(j.radius||{}).length<3) { console.error('radius too few'); process.exit(1); }
          if(Object.keys(j.color||{}).length<8) { console.error('colors too few'); process.exit(1); }
          console.log('tokens ok', JSON.stringify(c));
          "
