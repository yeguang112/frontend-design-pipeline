<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Fixture Site — 设计 token 提取用</title>
  <link rel="stylesheet" href="css/app.css">
  <style>
    :root {
      --color-bg: #08090a;
      --color-surface: #12141a;
      --color-text: #e6e8ec;
      --color-muted: #8b919d;
      --color-accent: #3b82f6;
      --color-border: #262a33;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #08090a;
      color: #e6e8ec;
      font-family: "Inter", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      letter-spacing: 0px;
    }

    .card {
      background: #12141a;
      border: 1px solid #262a33;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.32);
      transition: background-color 150ms ease-out, box-shadow 250ms ease-out;
    }

    .card__title {
      color: #e6e8ec;
      font-size: 20px;
      font-weight: 600;
      line-height: 1.4;
      margin: 0 0 8px;
    }

    .card__meta {
      color: #8b919d;
      font-size: 12px;
      line-height: 1.5;
      letter-spacing: 0.5px;
    }

    .btn {
      background: #3b82f6;
      color: #ffffff;
      border: 0;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 150ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    .stack { display: flex; flex-direction: column; gap: 16px; }

    @media (min-width: 640px) {
      .card { padding: 32px; }
      .stack { gap: 24px; }
    }

    @media (min-width: 1024px) {
      .card { border-radius: 16px; padding: 48px; }
      .card__title { font-size: 24px; }
    }
  </style>
</head>
<body>
  <main class="stack" style="padding: 32px;">
    <section class="card">
      <h2 class="card__title">Fixture Site</h2>
      <p class="card__meta">用于 extract-tokens.mjs 的自测</p>
      <button class="btn" style="margin-top: 12px;">Action</button>
    </section>

    <section class="card" style="padding: 16px; border-radius: 8px;">
      <h2 class="card__title" style="font-size: 16px;">Second card</h2>
      <p class="card__meta" style="color: #8b919d;">inline styles also count</p>
      <span style="font-size: 12px; color: #ff6b6b;">danger text</span>
    </section>

    <footer style="padding: 24px 0; border-top: 1px solid #262a33;">
      <span class="card__meta">footer · z-index 100 in css</span>
    </footer>
  </main>
</body>
</html>
